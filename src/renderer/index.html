<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Marketing Team</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">🤖 AI Marketing Team</div>
      <div class="sub">营销 Agent · 数据分析与可视化 Agent · Electron 桌面端</div>
    </header>

    <main class="layout">
      <section class="panel form-panel">
        <h2>任务配置</h2>

        <label>Agent 类型</label>
        <select id="agentType">
          <option value="auto">自动识别</option>
          <option value="marketing">营销 Agent</option>
          <option value="analytics">数据分析 / 可视化 Agent</option>
        </select>

        <label>目标 / 需求 (Goal)</label>
        <textarea id="goal" rows="3" placeholder="例如：为新型 productivity SaaS 制定社交媒体营销方案"></textarea>

        <label>品牌 / 产品</label>
        <input id="brand" placeholder="Acme" />

        <label>行业</label>
        <input id="industry" placeholder="SaaS" />

        <label>目标受众</label>
        <input id="audience" placeholder="中小企业" />

        <label>预算</label>
        <input id="budget" placeholder="¥50,000" />

        <label>CSV 数据文件（数据分析 Agent 用）</label>
        <input id="csvFile" type="file" accept=".csv" />

        <button id="runBtn">▶ 运行 Agent</button>
        <div id="status" class="status"></div>
      </section>

      <section class="panel log-panel">
        <h2>运行日志</h2>
        <pre id="log" class="log"></pre>
      </section>

      <section class="panel result-panel">
        <h2>产出</h2>
        <div id="results"></div>
      </section>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
