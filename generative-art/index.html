<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generative Art Studio — 生成艺术工坊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#eee;font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;overflow:hidden;display:flex;height:100vh}
#sidebar{
  width:300px;flex-shrink:0;background:rgba(20,20,30,0.95);
  border-right:1px solid rgba(255,255,255,0.06);padding:20px;
  overflow-y:auto;display:flex;flex-direction:column;gap:12px;
  backdrop-filter:blur(12px)
}
#sidebar h1{font-size:16px;letter-spacing:1px;color:rgba(255,255,255,0.85)}
#sidebar h1 span{font-size:11px;color:rgba(255,255,255,0.35);display:block;margin-top:2px;font-weight:400}
.section-title{font-size:11px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;margin-top:8px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.mode-btn{
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.6);padding:10px 6px;border-radius:8px;
  font-size:11px;cursor:pointer;text-align:center;transition:all .2s
}
.mode-btn:hover{background:rgba(255,255,255,0.08)}
.mode-btn.active{background:rgba(100,140,255,0.15);border-color:rgba(100,140,255,0.4);color:#fff}
.mode-btn .icon{font-size:22px;display:block;margin-bottom:4px}
.palette-row{display:flex;gap:4px;flex-wrap:wrap}
.palette-btn{
  width:48px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;
  transition:all .2s;display:flex;overflow:hidden
}
.palette-btn.active{border-color:#fff;transform:scale(1.08)}
.palette-btn span{flex:1}
.slider-row{display:flex;align-items:center;gap:8px}
.slider-row label{font-size:11px;color:rgba(255,255,255,0.5);width:70px;flex-shrink:0}
.slider-row input[type=range]{flex:1;accent-color:#648cff;height:3px}
.slider-row .val{font-size:10px;color:rgba(255,255,255,0.4);width:36px;text-align:right}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.btn{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.7);padding:6px 14px;border-radius:16px;
  font-size:11px;cursor:pointer;transition:all .2s;white-space:nowrap
}
.btn:hover{background:rgba(255,255,255,0.12);color:#fff}
.btn.primary{background:rgba(100,140,255,0.2);border-color:rgba(100,140,255,0.3);color:#a0c4ff}
#canvas-wrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center}
canvas{display:block;cursor:crosshair}
#fps{position:absolute;bottom:10px;right:14px;font-size:11px;color:rgba(255,255,255,0.25)}
#hint{position:absolute;bottom:10px;left:14px;font-size:11px;color:rgba(255,255,255,0.25)}
@media(max-width:768px){
  body{flex-direction:column}
  #sidebar{width:100%;height:auto;max-height:40vh;border-right:none;border-bottom:1px solid rgba(255,255,255,0.06)}
  #canvas-wrap{flex:1}
}
</style>
</head>
<body>

<div id="sidebar">
  <h1>Generative Art<span>生成艺术工坊</span></h1>

  <div class="section-title">算法模式</div>
  <div class="mode-grid">
    <div class="mode-btn active" data-mode="flow"><span class="icon">🌊</span>流场</div>
    <div class="mode-btn" data-mode="reaction"><span class="icon">🧬</span>反应扩散</div>
    <div class="mode-btn" data-mode="spiro"><span class="icon">🌀</span>螺旋线</div>
    <div class="mode-btn" data-mode="tree"><span class="icon">🌿</span>分形树</div>
    <div class="mode-btn" data-mode="voronoi"><span class="icon">🔷</span>泰森图</div>
    <div class="mode-btn" data-mode="wave"><span class="icon">〰️</span>波纹</div>
  </div>

  <div class="section-title">配色方案</div>
  <div class="palette-row" id="palettes"></div>

  <div class="section-title" id="paramsTitle">参数</div>
  <div id="params"></div>

  <div class="section-title">操作</div>
  <div class="btn-row">
    <div class="btn primary" id="btnGenerate">生成</div>
    <div class="btn" id="btnClear">清空</div>
    <div class="btn" id="btnExport">导出 PNG</div>
    <div class="btn" id="btnPause">暂停</div>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="fps"></div>
  <div id="hint">点击画布交互</div>
</div>

<script>
// ===== SETUP =====
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, mode = 'flow', paused = false, animId = null;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = canvas.width = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
}
resize();
window.addEventListener('resize', () => { resize(); generate(); });

// ===== PALETTES (optimized: curated from Coolors / Adobe Color trends) =====
const PALETTES = {
  sunset:   { name:'日落',  colors:['#FF6B6B','#FFA07A','#FFD93D','#6BCB77','#4D96FF'] },
  neon:     { name:'霓虹',  colors:['#FF006E','#8338EC','#3A86FF','#06D6A0','#FFBE0B'] },
  pastel:   { name:'粉彩',  colors:['#FFB5E8','#FF9CEE','#B28DFF','#85E3FF','#BFFCC6'] },
  ocean:    { name:'海洋',  colors:['#03045E','#0077B6','#00B4D8','#90E0EF','#CAF0F8'] },
  forest:   { name:'森林',  colors:['#1B4332','#2D6A4F','#40916C','#74C69D','#B7E4C7'] },
  monochrome:{ name:'黑白', colors:['#FFFFFF','#CCCCCC','#888888','#444444','#222222'] },
  cyberpunk:{ name:'赛博',  colors:['#F72585','#7209B7','#3A0CA3','#4361EE','#4CC9F0'] },
  warm:     { name:'暖阳',  colors:['#F94144','#F3722C','#F8961E','#F9C74F','#90BE6D'] },
};
let currentPalette = 'sunset';

// ===== PARAM DEFINITIONS (optimized: per-mode parameters) =====
const PARAM_DEFS = {
  flow: [
    { id:'particles', label:'粒子数', min:500, max:10000, step:500, val:3000 },
    { id:'noiseScale', label:'噪声尺度', min:0.001, max:0.02, step:0.001, val:0.005 },
    { id:'speed', label:'速度', min:0.5, max:5, step:0.5, val:2 },
    { id:'fade', label:'拖尾', min:0, max:50, step:1, val:5 },
  ],
  reaction: [
    { id:'feed', label:'供给 F', min:0.01, max:0.08, step:0.002, val:0.055 },
    { id:'kill', label:'消耗 K', min:0.04, max:0.07, step:0.001, val:0.062 },
    { id:'speed', label:'速度', min:1, max:20, step:1, val:8 },
  ],
  spiro: [
    { id:'outerR', label:'外圆半径', min:50, max:300, step:10, val:180 },
    { id:'innerR', label:'内圆半径', min:10, max:200, step:5, val:72 },
    { id:'penDist', label:'笔距', min:10, max:200, step:5, val:56 },
    { id:'speed', label:'速度', min:1, max:20, step:1, val:5 },
  ],
  tree: [
    { id:'depth', label:'递归深度', min:3, max:12, step:1, val:9 },
    { id:'branchAngle', label:'分枝角', min:10, max:60, step:2, val:25 },
    { id:'shrink', label:'缩放比', min:0.5, max:0.9, step:0.02, val:0.72 },
    { id:'wind', label:'风力', min:-20, max:20, step:1, val:5 },
  ],
  voronoi: [
    { id:'points', label:'种子数', min:10, max:500, step:10, val:100 },
    { id:'animSpeed', label:'移动速度', min:0, max:3, step:0.1, val:0.5 },
    { id:'edgeWidth', label:'边宽', min:0, max:5, step:0.5, val:1 },
  ],
  wave: [
    { id:'waves', label:'波源数', min:1, max:10, step:1, val:3 },
    { id:'frequency', label:'频率', min:0.01, max:0.1, step:0.005, val:0.04 },
    { id:'damping', label:'衰减', min:0.9, max:1, step:0.005, val:0.98 },
  ],
};

let params = {};
let state = {};

// ===== NOISE (simplified Perlin) =====
class SimplexNoise {
  constructor(seed = Math.random()) {
    this.p = new Uint8Array(512);
    const perm = new Uint8Array(256);
    for (let i = 0; i < 256; i++) perm[i] = i;
    for (let i = 255; i > 0; i--) {
      seed = (seed * 16807) % 2147483647;
      const j = seed % (i + 1);
      [perm[i], perm[j]] = [perm[j], perm[i]];
    }
    for (let i = 0; i < 512; i++) this.p[i] = perm[i & 255];
  }
  noise2D(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = x * x * (3 - 2 * x), v = y * y * (3 - 2 * y);
    const a = this.p[X] + Y, b = this.p[X + 1] + Y;
    const grad = (h, gx, gy) => { const g = h & 3; return (g < 2 ? (g === 0 ? gx : -gx) : (g === 2 ? gy : -gy)); };
    return (1 - v) * ((1 - u) * grad(this.p[a], x, y) + u * grad(this.p[b], x - 1, y))
         + v * ((1 - u) * grad(this.p[a + 1], x, y - 1) + u * grad(this.p[b + 1], x - 1, y - 1));
  }
}
const noise = new SimplexNoise();

// ===== MODE IMPLEMENTATIONS =====
const modes = {
  flow: {
    init() {
      const n = params.particles;
      state.particles = Array.from({length: n}, () => ({
        x: Math.random() * W, y: Math.random() * H,
        px: 0, py: 0, age: 0
      }));
      state.time = 0;
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, W, H);
    },
    update() {
      const { noiseScale, speed, fade } = params;
      state.time += 0.002;
      ctx.fillStyle = `rgba(17,17,17,${fade / 255})`;
      ctx.fillRect(0, 0, W, H);
      const colors = PALETTES[currentPalette].colors;
      for (const p of state.particles) {
        const angle = noise.noise2D(p.x * noiseScale, p.y * noiseScale + state.time) * Math.PI * 4;
        p.px = p.x; p.py = p.y;
        p.x += Math.cos(angle) * speed;
        p.y += Math.sin(angle) * speed;
        p.age++;
        if (p.x < 0 || p.x >= W || p.y < 0 || p.y >= H || p.age > 300) {
          p.x = Math.random() * W; p.y = Math.random() * H;
          p.px = p.x; p.py = p.y; p.age = 0;
        }
        const ci = Math.floor(Math.abs(noise.noise2D(p.x * 0.002, p.y * 0.002)) * colors.length) % colors.length;
        ctx.strokeStyle = colors[ci];
        ctx.globalAlpha = Math.min(1, p.age / 10) * 0.6;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.px, p.py);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    },
    onClick(x, y) {
      for (let i = 0; i < 50; i++) {
        state.particles.push({ x: x + (Math.random()-0.5)*40, y: y + (Math.random()-0.5)*40, px:x, py:y, age:0 });
      }
    }
  },

  reaction: {
    init() {
      const w = Math.min(W, 300), h = Math.min(H, 300);
      state.w = w; state.h = h;
      state.gridA = new Float32Array(w * h).fill(1);
      state.gridB = new Float32Array(w * h).fill(0);
      // Seed center
      const cx = w >> 1, cy = h >> 1;
      for (let dy = -10; dy <= 10; dy++)
        for (let dx = -10; dx <= 10; dx++)
          if (dx*dx + dy*dy < 100) state.gridB[(cy+dy)*w + (cx+dx)] = 1;
      state.imgData = ctx.createImageData(w, h);
    },
    update() {
      const { w, h, gridA, gridB, imgData } = state;
      const { feed, kill } = params;
      const dA = 1.0, dB = 0.5;
      const steps = params.speed;

      for (let s = 0; s < steps; s++) {
        const nA = new Float32Array(w * h);
        const nB = new Float32Array(w * h);
        for (let y = 1; y < h-1; y++) {
          for (let x = 1; x < w-1; x++) {
            const i = y*w+x;
            const a = gridA[i], b = gridB[i];
            const lapA = gridA[i-1]+gridA[i+1]+gridA[i-w]+gridA[i+w]-4*a;
            const lapB = gridB[i-1]+gridB[i+1]+gridB[i-w]+gridB[i+w]-4*b;
            const abb = a*b*b;
            nA[i] = Math.max(0, Math.min(1, a + dA*lapA - abb + feed*(1-a)));
            nB[i] = Math.max(0, Math.min(1, b + dB*lapB + abb - (kill+feed)*b));
          }
        }
        state.gridA = nA; state.gridB = nB;
        state.gridA[0] = gridA; state.gridB[0] = gridB;
      }
      // Render
      const colors = PALETTES[currentPalette].colors.map(c => {
        const m = c.match(/\w{2}/g).slice(1);
        return m.map(v => parseInt(v, 16));
      });
      const data = imgData.data;
      for (let i = 0; i < w*h; i++) {
        const v = state.gridB[i];
        const ci = Math.min(colors.length-1, Math.floor(v * colors.length));
        const mix = (v * colors.length) - ci;
        const c1 = colors[ci], c2 = colors[Math.min(colors.length-1, ci+1)];
        data[i*4]   = c1[0] + (c2[0]-c1[0]) * mix;
        data[i*4+1] = c1[1] + (c2[1]-c1[1]) * mix;
        data[i*4+2] = c1[2] + (c2[2]-c1[2]) * mix;
        data[i*4+3] = 255;
      }
      // Scale to canvas
      const offscreen = document.createElement('canvas');
      offscreen.width = w; offscreen.height = h;
      offscreen.getContext('2d').putImageData(imgData, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, W, H);
      const scale = Math.min(W/w, H/h);
      const dx = (W - w*scale)/2, dy = (H - h*scale)/2;
      ctx.drawImage(offscreen, dx, dy, w*scale, h*scale);
    },
    onClick(x, y) {
      const { w, h } = state;
      const sx = Math.floor(x / W * w), sy = Math.floor(y / H * h);
      for (let dy = -5; dy <= 5; dy++)
        for (let dx = -5; dx <= 5; dx++) {
          const i = (sy+dy)*w + (sx+dx);
          if (i >= 0 && i < w*h) state.gridB[i] = 1;
        }
    }
  },

  spiro: {
    init() {
      state.angle = 0;
      state.points = [];
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, W, H);
    },
    update() {
      const { outerR, innerR, penDist, speed } = params;
      const colors = PALETTES[currentPalette].colors;
      const cx = W/2, cy = H/2;
      const steps = speed * 50;

      ctx.fillStyle = 'rgba(17,17,17,0.005)';
      ctx.fillRect(0, 0, W, H);

      for (let i = 0; i < steps; i++) {
        state.angle += 0.02;
        const t = state.angle;
        const diff = outerR - innerR;
        const x = cx + diff * Math.cos(t) + penDist * Math.cos((diff / innerR) * t);
        const y = cy + diff * Math.sin(t) - penDist * Math.sin((diff / innerR) * t);
        const ci = Math.floor((t * 0.1) % colors.length);
        const alpha = 0.4 + 0.3 * Math.sin(t * 0.5);
        ctx.fillStyle = colors[ci];
        ctx.globalAlpha = alpha;
        ctx.fillRect(x, y, 1.5, 1.5);
      }
      ctx.globalAlpha = 1;
    },
    onClick() { this.init(); }
  },

  tree: {
    init() {
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, W, H);
      this.drawTree(W/2, H * 0.85, -Math.PI/2, params.depth, params.branchAngle, params.shrink, params.wind);
    },
    drawTree(x, y, angle, depth, branchAngle, shrink, wind) {
      if (depth === 0) return;
      const len = depth * 12 * shrink;
      const endX = x + Math.cos(angle) * len;
      const endY = y + Math.sin(angle) * len;
      const colors = PALETTES[currentPalette].colors;
      const ci = Math.min(colors.length-1, params.depth - depth);
      ctx.strokeStyle = colors[ci];
      ctx.lineWidth = depth * 0.8;
      ctx.globalAlpha = 0.5 + depth / params.depth * 0.5;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(endX, endY);
      ctx.stroke();

      if (depth <= 2) {
        // Draw leaves
        ctx.fillStyle = colors[colors.length - 1];
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(endX, endY, 3 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
      }

      const windRad = wind * Math.PI / 180;
      const angleRad = branchAngle * Math.PI / 180;
      this.drawTree(endX, endY, angle - angleRad + windRad * 0.3, depth - 1, branchAngle, shrink, wind);
      this.drawTree(endX, endY, angle + angleRad + windRad * 0.3, depth - 1, branchAngle, shrink, wind);
      if (depth > 5 && Math.random() > 0.6) {
        this.drawTree(endX, endY, angle + windRad * 0.5, depth - 2, branchAngle, shrink, wind);
      }
      ctx.globalAlpha = 1;
    },
    update() {},
    onClick() { this.init(); }
  },

  voronoi: {
    init() {
      const n = params.points;
      state.seeds = Array.from({length: n}, () => ({
        x: Math.random() * W, y: Math.random() * H,
        vx: (Math.random() - 0.5) * params.animSpeed,
        vy: (Math.random() - 0.5) * params.animSpeed,
      }));
    },
    update() {
      const colors = PALETTES[currentPalette].colors;
      const { seeds, animSpeed } = state;
      const ew = params.edgeWidth;

      // Move seeds
      for (const s of seeds) {
        s.x += s.vx * animSpeed;
        s.y += s.vy * animSpeed;
        if (s.x < 0 || s.x >= W) s.vx *= -1;
        if (s.y < 0 || s.y >= H) s.vy *= -1;
      }

      // Render via pixel sampling (optimized: stride-based)
      const imgData = ctx.createImageData(W, H);
      const data = imgData.data;
      const stride = 2;
      for (let y = 0; y < H; y += stride) {
        for (let x = 0; x < W; x += stride) {
          let minD = Infinity, minI = 0, secondD = Infinity;
          for (let i = 0; i < seeds.length; i++) {
            const dx = x - seeds[i].x, dy = y - seeds[i].y;
            const d = dx*dx + dy*dy;
            if (d < minD) { secondD = minD; minD = d; minI = i; }
            else if (d < secondD) secondD = d;
          }
          const c = colors[minI % colors.length];
          const rgb = [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
          const edge = ew > 0 && (Math.sqrt(secondD) - Math.sqrt(minD)) < ew * 3;
          for (let dy = 0; dy < stride && y+dy < H; dy++) {
            for (let dx = 0; dx < stride && x+dx < W; dx++) {
              const idx = ((y+dy)*W + (x+dx)) * 4;
              if (edge) { data[idx]=20;data[idx+1]=20;data[idx+2]=20; }
              else { data[idx]=rgb[0];data[idx+1]=rgb[1];data[idx+2]=rgb[2]; }
              data[idx+3] = 255;
            }
          }
        }
      }
      ctx.putImageData(imgData, 0, 0);
    },
    onClick(x, y) {
      state.seeds.push({ x, y, vx: (Math.random()-0.5)*params.animSpeed, vy: (Math.random()-0.5)*params.animSpeed });
    }
  },

  wave: {
    init() {
      state.grid = new Float32Array(W * H).fill(0);
      state.prev = new Float32Array(W * H).fill(0);
      state.sources = [];
      for (let i = 0; i < params.waves; i++) {
        state.sources.push({ x: Math.random() * W, y: Math.random() * H, phase: Math.random() * Math.PI * 2 });
      }
      state.time = 0;
    },
    update() {
      const { frequency, damping } = params;
      const { grid, prev, sources } = state;
      state.time += 1;

      // Sources
      for (const s of sources) {
        const sx = Math.floor(s.x), sy = Math.floor(s.y);
        if (sx > 0 && sx < W-1 && sy > 0 && sy < H-1) {
          grid[sy * W + sx] = Math.sin(state.time * frequency * 3 + s.phase) * 2;
        }
      }

      // Wave equation
      const next = new Float32Array(W * H);
      for (let y = 1; y < H-1; y++) {
        for (let x = 1; x < W-1; x++) {
          const i = y * W + x;
          next[i] = (grid[i-1] + grid[i+1] + grid[i-W] + grid[i+W]) / 2 - prev[i];
          next[i] *= damping;
        }
      }
      state.prev = grid;
      state.grid = next;

      // Render (stride for performance)
      const colors = PALETTES[currentPalette].colors;
      const stride = 3;
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, W, H);
      for (let y = 0; y < H; y += stride) {
        for (let x = 0; x < W; x += stride) {
          const v = (next[y * W + x] + 1) / 2;
          const ci = Math.floor(v * colors.length) % colors.length;
          ctx.fillStyle = colors[ci];
          ctx.globalAlpha = Math.abs(v - 0.5) * 2;
          ctx.fillRect(x, y, stride, stride);
        }
      }
      ctx.globalAlpha = 1;
    },
    onClick(x, y) {
      state.sources.push({ x, y, phase: Math.random() * Math.PI * 2 });
    }
  }
};

// ===== UI BUILDERS =====
function buildPalettes() {
  const el = document.getElementById('palettes');
  el.innerHTML = '';
  for (const [key, pal] of Object.entries(PALETTES)) {
    const btn = document.createElement('div');
    btn.className = 'palette-btn' + (key === currentPalette ? ' active' : '');
    btn.innerHTML = pal.colors.map(c => `<span style="background:${c}"></span>`).join('');
    btn.onclick = () => {
      currentPalette = key;
      document.querySelectorAll('.palette-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
    el.appendChild(btn);
  }
}

function buildParams() {
  const el = document.getElementById('params');
  const defs = PARAM_DEFS[mode] || [];
  el.innerHTML = '';
  params = {};
  for (const d of defs) {
    params[d.id] = d.val;
    const row = document.createElement('div');
    row.className = 'slider-row';
    row.innerHTML = `
      <label>${d.label}</label>
      <input type="range" min="${d.min}" max="${d.max}" step="${d.step}" value="${d.val}" id="p_${d.id}">
      <span class="val" id="v_${d.id}">${d.val}</span>`;
    el.appendChild(row);
    row.querySelector('input').oninput = function() {
      params[d.id] = +this.value;
      document.getElementById('v_' + d.id).textContent = this.value;
    };
  }
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  buildParams();
  generate();
}

function generate() {
  if (animId) cancelAnimationFrame(animId);
  const m = modes[mode];
  if (m.init) m.init();
  function loop() {
    if (!paused && m.update) m.update();
    animId = requestAnimationFrame(loop);
  }
  // fps counter
  let fc = 0, lt = performance.now();
  const origLoop = loop;
  loop = function() {
    if (!paused && m.update) m.update();
    fc++;
    const now = performance.now();
    if (now - lt >= 1000) {
      document.getElementById('fps').textContent = fc + ' FPS';
      fc = 0; lt = now;
    }
    animId = requestAnimationFrame(loop);
  };
  loop();
}

// Mode buttons
document.querySelectorAll('.mode-btn').forEach(b => {
  b.onclick = () => setMode(b.dataset.mode);
});

// Action buttons
document.getElementById('btnGenerate').onclick = () => generate();
document.getElementById('btnClear').onclick = () => { ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H); };
document.getElementById('btnExport').onclick = () => {
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `generative-art-${mode}-${Date.now()}.png`;
    a.click();
  });
};
document.getElementById('btnPause').onclick = function() {
  paused = !paused;
  this.textContent = paused ? '继续' : '暂停';
};

// Canvas click
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);
  const m = modes[mode];
  if (m.onClick) m.onClick(x, y);
});

// ===== INIT =====
buildPalettes();
buildParams();
generate();
</script>
</body>
</html>
