<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zen Fluid — 流体艺术工坊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:-apple-system,'PingFang SC',sans-serif}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;top:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.btn{
  background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.12);
  color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;
  transition:all .2s;user-select:none;white-space:nowrap
}
.btn:hover{background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3)}
.btn.active{background:rgba(255,255,255,0.2);border-color:rgba(255,255,255,0.4)}
#themes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.theme-dot{
  width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:all .2s;position:relative
}
.theme-dot.active{border-color:#fff;transform:scale(1.15)}
.theme-dot::after{content:attr(data-name);position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  font-size:10px;color:rgba(255,255,255,0.5);white-space:nowrap;opacity:0;transition:opacity .2s}
.theme-dot:hover::after{opacity:1}
#title{position:fixed;top:20px;left:24px;z-index:100;color:rgba(255,255,255,0.7);font-size:14px;font-weight:600;letter-spacing:1px}
#title span{font-size:11px;font-weight:400;color:rgba(255,255,255,0.35);display:block;margin-top:2px}
#hint{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;
  color:rgba(255,255,255,0.3);font-size:12px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.7}}
@media(max-width:768px){
  #ui{top:12px;right:12px;gap:6px}
  .btn{padding:6px 12px;font-size:12px}
  .theme-dot{width:24px;height:24px}
  #title{font-size:12px;left:14px;top:14px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Zen Fluid<span>流体艺术工坊</span></div>
<div id="ui">
  <div id="themes"></div>
  <div style="display:flex;gap:6px">
    <div class="btn" id="btnSplat">随机飞溅</div>
    <div class="btn" id="btnSave">保存图片</div>
  </div>
</div>
<div id="hint">拖动 / 触摸以创造流体 · 双击切换主题</div>

<script>
// ===== CONFIG =====
const config = {
  SIM_RESOLUTION: 128,
  DYE_RESOLUTION: 1024,
  DENSITY_DISSIPATION: 0.97,
  VELOCITY_DISSIPATION: 0.98,
  PRESSURE_ITERATIONS: 20,
  CURL: 30,
  SPLAT_RADIUS: 0.25,
  SPLAT_FORCE: 6000,
  COLOR_INTENSITY: 1.0,
  BLOOM: true,
  BLOOM_INTENSITY: 0.4,
  PAUSED: false,
  theme: 'aurora'
};

// ===== COLOR THEMES (optimized vs original: curated palettes instead of random) =====
const themes = {
  aurora:  { name:'极光',  bg:'#020810', colors:['#00ff87','#60efff','#7b61ff','#ff6ec7','#00d4ff'] },
  neon:    { name:'霓虹',  bg:'#0a0014', colors:['#ff006e','#8338ec','#3a86ff','#06d6a0','#ffbe0b'] },
  ink:     { name:'水墨',  bg:'#0a0a0a', colors:['#ffffff','#cccccc','#888888','#555555','#333333'] },
  sunset:  { name:'日落',  bg:'#0d0508', colors:['#ff4500','#ff6b35','#f7c59f','#ffd166','#ef476f'] },
  ocean:   { name:'深海',  bg:'#000510', colors:['#0077b6','#00b4d8','#90e0ef','#48cae4','#023e8a'] },
  sakura:  { name:'樱花',  bg:'#0a0508', colors:['#ffb7c5','#ff69b4','#ff1493','#c71585','#ffc0cb'] },
};

// ===== INIT WEBGL =====
const canvas = document.getElementById('c');
let gl, ext;
function getWebGLContext(canvas) {
  const params = { alpha: true, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
  let gl = canvas.getContext('webgl2', params);
  const isWebGL2 = !!gl;
  if (!gl) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
  let halfFloat, supportLinearFiltering;
  if (isWebGL2) {
    gl.getExtension('EXT_color_buffer_float');
    supportLinearFiltering = gl.getExtension('OES_texture_float_linear');
  } else {
    halfFloat = gl.getExtension('OES_texture_half_float');
    supportLinearFiltering = gl.getExtension('OES_texture_half_float_linear');
  }
  const halfFloatTexType = isWebGL2 ? gl.HALF_FLOAT : halfFloat?.HALF_FLOAT_OES;
  const texType = isWebGL2 ? gl.FLOAT : halfFloatTexType;
  const rg = isWebGL2 ? { internalFormat: gl.RG16F, format: gl.RG } : { internalFormat: gl.RGBA, format: gl.RGBA };
  const r = isWebGL2 ? { internalFormat: gl.R16F, format: gl.RED } : { internalFormat: gl.RGBA, format: gl.RGBA };
  return { gl, ext: { isWebGL2, halfFloatTexType, texType, supportLinearFiltering, rg, r } };
}

const ctx = getWebGLContext(canvas);
gl = ctx.gl; ext = ctx.ext;

// ===== SHADER SOURCES =====
const baseVertexShader = `
  precision highp float;
  attribute vec2 aPosition;
  varying vec2 vUv;
  varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
  uniform vec2 texelSize;
  void main () {
    vUv = aPosition * 0.5 + 0.5;
    vL = vUv - vec2(texelSize.x, 0.0);
    vR = vUv + vec2(texelSize.x, 0.0);
    vT = vUv + vec2(0.0, texelSize.y);
    vB = vUv - vec2(0.0, texelSize.y);
    gl_Position = vec4(aPosition, 0.0, 1.0);
  }`;

const displayShaderSource = `
  precision highp float;
  precision highp sampler2D;
  varying vec2 vUv;
  uniform sampler2D uTexture;
  uniform sampler2D uBloom;
  uniform sampler2D uDithering;
  uniform vec2 ditherScale;
  uniform vec2 texelSize;
  vec3 linearToGamma (vec3 color) {
    color = max(color, vec3(0));
    return max(1.055 * pow(color, vec3(0.416666667)) - 0.055, vec3(0));
  }
  void main () {
    vec3 c = texture2D(uTexture, vUv).rgb;
    vec3 bloom = texture2D(uBloom, vUv).rgb;
    vec3 noise = texture2D(uDithering, vUv * ditherScale).rgb;
    noise = noise * 2.0 - 1.0;
    bloom *= ${config.BLOOM_INTENSITY.toFixed(2)};
    c += bloom;
    c += noise / 255.0;
    c = linearToGamma(c);
    gl_FragColor = vec4(c, 1.0);
  }`;

const splatShader = `
  precision highp float;
  precision highp sampler2D;
  varying vec2 vUv;
  uniform sampler2D uTarget;
  uniform float aspectRatio;
  uniform vec3 color;
  uniform vec2 point;
  uniform float radius;
  void main () {
    vec2 p = vUv - point.xy;
    p.x *= aspectRatio;
    vec3 splat = exp(-dot(p, p) / radius) * color;
    vec3 base = texture2D(uTarget, vUv).xyz;
    gl_FragColor = vec4(base + splat, 1.0);
  }`;

const advectionShader = `
  precision highp float;
  precision highp sampler2D;
  varying vec2 vUv;
  uniform sampler2D uVelocity;
  uniform sampler2D uSource;
  uniform vec2 texelSize;
  uniform vec2 dyeTexelSize;
  uniform float dt;
  uniform float dissipation;
  vec4 bilerp (sampler2D sam, vec2 uv, vec2 tsize) {
    vec2 st = uv / tsize - 0.5;
    vec2 iuv = floor(st);
    vec2 fuv = fract(st);
    vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * tsize);
    vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * tsize);
    vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * tsize);
    vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * tsize);
    return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
  }
  void main () {
    vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
    vec4 result = ${ext.supportLinearFiltering ? 'texture2D(uSource, coord)' : 'bilerp(uSource, coord, dyeTexelSize)'};
    float decay = 1.0 + dissipation * dt;
    gl_FragColor = result / decay;
  }`;

const divergenceShader = `
  precision mediump float;
  precision mediump sampler2D;
  varying highp vec2 vUv;
  varying highp vec2 vL; varying highp vec2 vR; varying highp vec2 vT; varying highp vec2 vB;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uVelocity, vL).x;
    float R = texture2D(uVelocity, vR).x;
    float T = texture2D(uVelocity, vT).y;
    float B = texture2D(uVelocity, vB).y;
    vec2 C = texture2D(uVelocity, vUv).xy;
    if (vL.x < 0.0) L = -C.x;
    if (vR.x > 1.0) R = -C.x;
    if (vT.y > 1.0) T = -C.y;
    if (vB.y < 0.0) B = -C.y;
    float div = 0.5 * (R - L + T - B);
    gl_FragColor = vec4(div, 0.0, 0.0, 1.0);
  }`;

const curlShader = `
  precision mediump float;
  precision mediump sampler2D;
  varying highp vec2 vUv;
  varying highp vec2 vL; varying highp vec2 vR; varying highp vec2 vT; varying highp vec2 vB;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uVelocity, vL).y;
    float R = texture2D(uVelocity, vR).y;
    float T = texture2D(uVelocity, vT).x;
    float B = texture2D(uVelocity, vB).x;
    float vorticity = R - L - T + B;
    gl_FragColor = vec4(0.5 * vorticity, 0.0, 0.0, 1.0);
  }`;

const vorticityShader = `
  precision highp float;
  precision highp sampler2D;
  varying vec2 vUv;
  varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
  uniform sampler2D uVelocity;
  uniform sampler2D uCurl;
  uniform float curl;
  uniform float dt;
  void main () {
    float L = texture2D(uCurl, vL).x;
    float R = texture2D(uCurl, vR).x;
    float T = texture2D(uCurl, vT).x;
    float B = texture2D(uCurl, vB).x;
    float C = texture2D(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 0.0001;
    force *= curl * C;
    force.y *= -1.0;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity += force * dt;
    velocity = min(max(velocity, -1000.0), 1000.0);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }`;

const pressureShader = `
  precision mediump float;
  precision mediump sampler2D;
  varying highp vec2 vUv;
  varying highp vec2 vL; varying highp vec2 vR; varying highp vec2 vT; varying highp vec2 vB;
  uniform sampler2D uPressure;
  uniform sampler2D uDivergence;
  void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    float C = texture2D(uPressure, vUv).x;
    float divergence = texture2D(uDivergence, vUv).x;
    float pressure = (L + R + B + T - divergence) * 0.25;
    gl_FragColor = vec4(pressure, 0.0, 0.0, 1.0);
  }`;

const gradientSubtractShader = `
  precision mediump float;
  precision mediump sampler2D;
  varying highp vec2 vUv;
  varying highp vec2 vL; varying highp vec2 vR; varying highp vec2 vT; varying highp vec2 vB;
  uniform sampler2D uPressure;
  uniform sampler2D uVelocity;
  void main () {
    float L = texture2D(uPressure, vL).x;
    float R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x;
    float B = texture2D(uPressure, vB).x;
    vec2 velocity = texture2D(uVelocity, vUv).xy;
    velocity.xy -= vec2(R - L, T - B);
    gl_FragColor = vec4(velocity, 0.0, 1.0);
  }`;

const clearShader = `
  precision mediump float;
  precision mediump sampler2D;
  varying highp vec2 vUv;
  uniform sampler2D uTexture;
  uniform float value;
  void main () {
    gl_FragColor = value * texture2D(uTexture, vUv);
  }`;

const bloomPrefilterShader = `
  precision mediump float;
  precision mediump sampler2D;
  varying vec2 vUv;
  uniform sampler2D uTexture;
  uniform vec3 curve;
  uniform float threshold;
  void main () {
    vec3 c = texture2D(uTexture, vUv).rgb;
    float br = max(c.r, max(c.g, c.b));
    float rq = clamp(br - curve.x, 0.0, curve.y);
    rq = curve.z * rq * rq;
    c *= max(rq, br - threshold) / max(br, 0.0001);
    gl_FragColor = vec4(c, 0.0);
  }`;

const bloomBlurShader = `
  precision mediump float;
  precision mediump sampler2D;
  varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
  uniform sampler2D uTexture;
  void main () {
    vec4 sum = vec4(0.0);
    sum += texture2D(uTexture, vL);
    sum += texture2D(uTexture, vR);
    sum += texture2D(uTexture, vT);
    sum += texture2D(uTexture, vB);
    sum *= 0.25;
    gl_FragColor = sum;
  }`;

const bloomFinalShader = `
  precision mediump float;
  precision mediump sampler2D;
  varying vec2 vL; varying vec2 vR; varying vec2 vT; varying vec2 vB;
  uniform sampler2D uTexture;
  uniform float intensity;
  void main () {
    vec4 sum = vec4(0.0);
    sum += texture2D(uTexture, vL);
    sum += texture2D(uTexture, vR);
    sum += texture2D(uTexture, vT);
    sum += texture2D(uTexture, vB);
    sum *= 0.25;
    gl_FragColor = sum * intensity;
  }`;

// ===== COMPILE HELPERS =====
function compileShader(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(shader));
  return shader;
}

function createProgram(vertSrc, fragSrc) {
  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vertSrc));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
  const uniforms = {};
  const count = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const name = gl.getActiveUniform(prog, i).name;
    uniforms[name] = gl.getUniformLocation(prog, name);
  }
  return { program: prog, uniforms, bind: () => gl.useProgram(prog) };
}

// ===== GEOMETRY =====
const quadVAO = (() => {
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  return buf;
})();

function blit(target) {
  gl.bindBuffer(gl.ARRAY_BUFFER, quadVAO);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.enableVertexAttribArray(0);
  if (target == null) {
    gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  } else {
    gl.viewport(0, 0, target.width, target.height);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

// ===== FBO HELPERS =====
function createFBO(w, h, intFormat, format, type, filter) {
  gl.activeTexture(gl.TEXTURE0);
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, intFormat, w, h, 0, format, type, null);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.viewport(0, 0, w, h);
  gl.clear(gl.COLOR_BUFFER_BIT);
  const texelSizeX = 1.0 / w, texelSizeY = 1.0 / h;
  return { texture, fbo, width: w, height: h, texelSizeX, texelSizeY, attach(id) { gl.activeTexture(gl.TEXTURE0 + id); gl.bindTexture(gl.TEXTURE_2D, texture); return id; } };
}

function createDoubleFBO(w, h, intFormat, format, type, filter) {
  let fbo1 = createFBO(w, h, intFormat, format, type, filter);
  let fbo2 = createFBO(w, h, intFormat, format, type, filter);
  return {
    width: w, height: h, texelSizeX: fbo1.texelSizeX, texelSizeY: fbo1.texelSizeY,
    get read() { return fbo1; }, set read(v) { fbo1 = v; },
    get write() { return fbo2; }, set write(v) { fbo2 = v; },
    swap() { let t = fbo1; fbo1 = fbo2; fbo2 = t; }
  };
}

// ===== PROGRAMS =====
const displayProgram = createProgram(baseVertexShader, displayShaderSource);
const splatProgram = createProgram(baseVertexShader, splatShader);
const advectionProgram = createProgram(baseVertexShader, advectionShader);
const divergenceProgram = createProgram(baseVertexShader, divergenceShader);
const curlProgram = createProgram(baseVertexShader, curlShader);
const vorticityProgram = createProgram(baseVertexShader, vorticityShader);
const pressureProgram = createProgram(baseVertexShader, pressureShader);
const gradSubtractProgram = createProgram(baseVertexShader, gradientSubtractShader);
const clearProgram = createProgram(baseVertexShader, clearShader);
const bloomPrefilterProgram = createProgram(baseVertexShader, bloomPrefilterShader);
const bloomBlurProgram = createProgram(baseVertexShader, bloomBlurShader);
const bloomFinalProgram = createProgram(baseVertexShader, bloomFinalShader);

// ===== INIT FBOS =====
let dye, velocity, divergence, curl, pressure;
let bloomFBOs = [];

function getResolution(resolution) {
  let aspectRatio = gl.drawingBufferWidth / gl.drawingBufferHeight;
  if (aspectRatio < 1) aspectRatio = 1.0 / aspectRatio;
  const min = Math.round(resolution);
  const max = Math.round(resolution * aspectRatio);
  return gl.drawingBufferWidth > gl.drawingBufferHeight ? { width: max, height: min } : { width: min, height: max };
}

function initFramebuffers() {
  const simRes = getResolution(config.SIM_RESOLUTION);
  const dyeRes = getResolution(config.DYE_RESOLUTION);
  const texType = ext.texType;
  const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;

  dye = createDoubleFBO(dyeRes.width, dyeRes.height, ext.rg.internalFormat, ext.rg.format, texType, filtering);
  velocity = createDoubleFBO(simRes.width, simRes.height, ext.rg.internalFormat, ext.rg.format, texType, filtering);
  divergence = createFBO(simRes.width, simRes.height, ext.r.internalFormat, ext.r.format, texType, gl.NEAREST);
  curl = createFBO(simRes.width, simRes.height, ext.r.internalFormat, ext.r.format, texType, gl.NEAREST);
  pressure = createDoubleFBO(simRes.width, simRes.height, ext.r.internalFormat, ext.r.format, texType, gl.NEAREST);

  initBloomFramebuffers();
}

function initBloomFramebuffers() {
  const res = getResolution(256);
  const texType = ext.texType;
  const filtering = ext.supportLinearFiltering ? gl.LINEAR : gl.NEAREST;
  bloomFBOs = [];
  for (let i = 0; i < 5; i++) {
    const w = res.width >> (i + 1);
    const h = res.height >> (i + 1);
    if (w < 2 || h < 2) break;
    bloomFBOs.push(createFBO(w, h, ext.rg.internalFormat, ext.rg.format, texType, filtering));
  }
}

// ===== DITHER TEXTURE =====
const ditherTex = (() => {
  const size = 256;
  const d = new Uint8Array(size * size * 4);
  for (let i = 0; i < size * size; i++) {
    const v = Math.random() * 255;
    d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v;
    d[i * 4 + 3] = 255;
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, d);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  return tex;
})();

// ===== RESIZE =====
function resizeCanvas() {
  const w = window.innerWidth * devicePixelRatio;
  const h = window.innerHeight * devicePixelRatio;
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    initFramebuffers();
  }
}

// ===== SIMULATION =====
function step(dt) {
  gl.disable(gl.BLEND);

  // Curl
  curlProgram.bind();
  gl.uniform2f(curlProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(curlProgram.uniforms.uVelocity, velocity.read.attach(0));
  blit(curl);

  // Vorticity
  vorticityProgram.bind();
  gl.uniform2f(vorticityProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(vorticityProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(vorticityProgram.uniforms.uCurl, curl.attach(1));
  gl.uniform1f(vorticityProgram.uniforms.curl, config.CURL);
  gl.uniform1f(vorticityProgram.uniforms.dt, dt);
  blit(velocity.write);
  velocity.swap();

  // Divergence
  divergenceProgram.bind();
  gl.uniform2f(divergenceProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(divergenceProgram.uniforms.uVelocity, velocity.read.attach(0));
  blit(divergence);

  // Clear pressure
  clearProgram.bind();
  gl.uniform1i(clearProgram.uniforms.uTexture, pressure.read.attach(0));
  gl.uniform1f(clearProgram.uniforms.value, 0.8);
  blit(pressure.write);
  pressure.swap();

  // Pressure solve
  pressureProgram.bind();
  gl.uniform2f(pressureProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(pressureProgram.uniforms.uDivergence, divergence.attach(0));
  for (let i = 0; i < config.PRESSURE_ITERATIONS; i++) {
    gl.uniform1i(pressureProgram.uniforms.uPressure, pressure.read.attach(1));
    blit(pressure.write);
    pressure.swap();
  }

  // Gradient subtract
  gradSubtractProgram.bind();
  gl.uniform2f(gradSubtractProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  gl.uniform1i(gradSubtractProgram.uniforms.uPressure, pressure.read.attach(0));
  gl.uniform1i(gradSubtractProgram.uniforms.uVelocity, velocity.read.attach(1));
  blit(velocity.write);
  velocity.swap();

  // Advect velocity
  advectionProgram.bind();
  gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  if (!ext.supportLinearFiltering) gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, velocity.texelSizeX, velocity.texelSizeY);
  let velId = velocity.read.attach(0);
  gl.uniform1i(advectionProgram.uniforms.uVelocity, velId);
  gl.uniform1i(advectionProgram.uniforms.uSource, velId);
  gl.uniform1f(advectionProgram.uniforms.dt, dt);
  gl.uniform1f(advectionProgram.uniforms.dissipation, 1.0 - config.VELOCITY_DISSIPATION);
  blit(velocity.write);
  velocity.swap();

  // Advect dye
  gl.uniform2f(advectionProgram.uniforms.texelSize, velocity.texelSizeX, velocity.texelSizeY);
  if (!ext.supportLinearFiltering) gl.uniform2f(advectionProgram.uniforms.dyeTexelSize, dye.texelSizeX, dye.texelSizeY);
  gl.uniform1i(advectionProgram.uniforms.uVelocity, velocity.read.attach(0));
  gl.uniform1i(advectionProgram.uniforms.uSource, dye.read.attach(1));
  gl.uniform1f(advectionProgram.uniforms.dissipation, 1.0 - config.DENSITY_DISSIPATION);
  blit(dye.write);
  dye.swap();
}

function applyBloom(source) {
  if (bloomFBOs.length < 2) return;
  let last = source;
  gl.disable(gl.BLEND);

  bloomPrefilterProgram.bind();
  const knee = 0.2, threshold = 0.6;
  const curve0 = threshold - knee;
  const curve1 = knee * 2;
  const curve2 = 0.25 / knee;
  gl.uniform3f(bloomPrefilterProgram.uniforms.curve, curve0, curve1, curve2);
  gl.uniform1f(bloomPrefilterProgram.uniforms.threshold, threshold);
  gl.uniform1i(bloomPrefilterProgram.uniforms.uTexture, last.attach(0));
  blit(bloomFBOs[0]);
  last = bloomFBOs[0];

  for (let i = 0; i < bloomFBOs.length; i++) {
    bloomBlurProgram.bind();
    gl.uniform2f(bloomBlurProgram.uniforms.texelSize, bloomFBOs[i].texelSizeX, bloomFBOs[i].texelSizeY);
    gl.uniform1i(bloomBlurProgram.uniforms.uTexture, last.attach(0));
    blit(bloomFBOs[i]);
    last = bloomFBOs[i];
  }

  gl.blendFunc(gl.ONE, gl.ONE);
  gl.enable(gl.BLEND);
  for (let i = bloomFBOs.length - 2; i >= 0; i--) {
    const dst = bloomFBOs[i];
    bloomFinalProgram.bind();
    gl.uniform2f(bloomFinalProgram.uniforms.texelSize, dst.texelSizeX, dst.texelSizeY);
    gl.uniform1i(bloomFinalProgram.uniforms.uTexture, last.attach(0));
    gl.uniform1f(bloomFinalProgram.uniforms.intensity, 0.8);
    blit(dst);
    last = dst;
  }
  gl.disable(gl.BLEND);
}

function render(target) {
  if (config.BLOOM) applyBloom(dye.read);

  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.enable(gl.BLEND);

  displayProgram.bind();
  gl.uniform2f(displayProgram.uniforms.texelSize, 1.0 / canvas.width, 1.0 / canvas.height);
  gl.uniform1i(displayProgram.uniforms.uTexture, dye.read.attach(0));
  gl.uniform1i(displayProgram.uniforms.uBloom, config.BLOOM && bloomFBOs.length ? bloomFBOs[0].attach(1) : dye.read.attach(1));
  gl.uniform1i(displayProgram.uniforms.uDithering, 2);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, ditherTex);
  const dW = ditherTex ? 256 : 1, dH = ditherTex ? 256 : 1;
  gl.uniform2f(displayProgram.uniforms.ditherScale, canvas.width / dW, canvas.height / dH);
  blit(target);
}

function splat(x, y, dx, dy, color) {
  splatProgram.bind();
  gl.uniform1i(splatProgram.uniforms.uTarget, velocity.read.attach(0));
  gl.uniform1f(splatProgram.uniforms.aspectRatio, canvas.width / canvas.height);
  gl.uniform2f(splatProgram.uniforms.point, x, y);
  gl.uniform3f(splatProgram.uniforms.color, dx, dy, 0.0);
  gl.uniform1f(splatProgram.uniforms.radius, correctRadius(config.SPLAT_RADIUS / 100.0));
  blit(velocity.write);
  velocity.swap();

  gl.uniform1i(splatProgram.uniforms.uTarget, dye.read.attach(0));
  gl.uniform3f(splatProgram.uniforms.color, color.r * config.COLOR_INTENSITY, color.g * config.COLOR_INTENSITY, color.b * config.COLOR_INTENSITY);
  blit(dye.write);
  dye.swap();
}

function correctRadius(r) {
  const aspect = canvas.width / canvas.height;
  return aspect > 1 ? r * aspect : r;
}

function getThemeColor() {
  const t = themes[config.theme];
  const hex = t.colors[Math.floor(Math.random() * t.colors.length)];
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return { r, g, b };
}

function randomSplats(count) {
  for (let i = 0; i < count; i++) {
    const color = getThemeColor();
    const x = Math.random();
    const y = Math.random();
    const dx = 1000 * (Math.random() - 0.5);
    const dy = 1000 * (Math.random() - 0.5);
    splat(x, y, dx, dy, color);
  }
}

// ===== INPUT =====
const pointers = [];
class Pointer {
  constructor(id) {
    this.id = id; this.texcoordX = 0; this.texcoordY = 0;
    this.prevTexcoordX = 0; this.prevTexcoordY = 0;
    this.deltaX = 0; this.deltaY = 0;
    this.down = false; this.moved = false;
    this.color = { r: 0.3, g: 0, b: 0 };
  }
}
pointers.push(new Pointer(-1));

canvas.addEventListener('mousedown', e => {
  pointers[0].down = true;
  pointers[0].color = getThemeColor();
  updatePointer(pointers[0], e.offsetX, e.offsetY);
});
canvas.addEventListener('mousemove', e => {
  if (!pointers[0].down) return;
  updatePointer(pointers[0], e.offsetX, e.offsetY);
});
window.addEventListener('mouseup', () => { pointers[0].down = false; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    let p = pointers.find(p => p.id === t.identifier);
    if (!p) { p = new Pointer(t.identifier); pointers.push(p); }
    p.down = true;
    p.color = getThemeColor();
    updatePointer(p, t.clientX, t.clientY);
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const p = pointers.find(p => p.id === t.identifier);
    if (p && p.down) updatePointer(p, t.clientX, t.clientY);
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    const p = pointers.find(p => p.id === t.identifier);
    if (p) p.down = false;
  }
});

function updatePointer(p, posX, posY) {
  p.prevTexcoordX = p.texcoordX;
  p.prevTexcoordY = p.texcoordY;
  p.texcoordX = posX / canvas.clientWidth;
  p.texcoordY = 1.0 - posY / canvas.clientHeight;
  p.deltaX = correctDeltaX(p.texcoordX - p.prevTexcoordX);
  p.deltaY = correctDeltaY(p.texcoordY - p.prevTexcoordY);
  p.moved = Math.abs(p.deltaX) > 0 || Math.abs(p.deltaY) > 0;
}
function correctDeltaX(d) { const a = canvas.width / canvas.height; return a < 1 ? d * a : d; }
function correctDeltaY(d) { const a = canvas.width / canvas.height; return a > 1 ? d / a : d; }

// ===== MAIN LOOP =====
let lastTime = Date.now();
let idleTimer = 0;

function update() {
  resizeCanvas();
  const now = Date.now();
  let dt = (now - lastTime) / 1000;
  dt = Math.min(dt, 0.016666);
  lastTime = now;

  if (!config.PAUSED) {
    for (const p of pointers) {
      if (p.moved) {
        p.moved = false;
        const force = config.SPLAT_FORCE;
        splat(p.texcoordX, p.texcoordY, p.deltaX * force, p.deltaY * force, p.color);
        idleTimer = 0;
      }
    }
    // Auto-splat on idle (optimized: creates gentle background animation)
    idleTimer += dt;
    if (idleTimer > 5) {
      randomSplats(1);
      idleTimer = 4;
    }
    step(dt);
  }
  render(null);
  requestAnimationFrame(update);
}

// ===== UI =====
const themesEl = document.getElementById('themes');
Object.keys(themes).forEach(key => {
  const t = themes[key];
  const dot = document.createElement('div');
  dot.className = 'theme-dot' + (key === config.theme ? ' active' : '');
  dot.dataset.name = t.name;
  dot.style.background = `linear-gradient(135deg, ${t.colors[0]}, ${t.colors[1]}, ${t.colors[2]})`;
  dot.onclick = () => {
    config.theme = key;
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
    dot.classList.add('active');
    document.body.style.background = t.bg;
    randomSplats(5);
  };
  themesEl.appendChild(dot);
});

document.getElementById('btnSplat').onclick = () => randomSplats(Math.floor(Math.random() * 15) + 10);
document.getElementById('btnSave').onclick = () => {
  render(null);
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `zen-fluid-${Date.now()}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  }, 'image/png');
};

// Double-click to cycle themes
let lastClick = 0;
canvas.addEventListener('click', () => {
  const now = Date.now();
  if (now - lastClick < 400) {
    const keys = Object.keys(themes);
    const idx = (keys.indexOf(config.theme) + 1) % keys.length;
    document.querySelector(`.theme-dot[data-name="${themes[keys[idx]].name}"]`)?.click();
  }
  lastClick = now;
});

// ===== START =====
resizeCanvas();
randomSplats(Math.floor(Math.random() * 10) + 5);
update();
</script>
</body>
